#!/usr/sbin/nft -f
# Host-level egress lockdown (Linux). UNTESTED in the build environment: review, then test on a console
# session, not over SSH, because it also cuts remote access. Load: sudo nft -f deploy/nftables-airgap.conf
# Remove: sudo nft delete table inet clarix_airgap
table inet clarix_airgap {
  chain output {
    type filter hook output priority 0; policy drop;
    oifname "lo" accept
    ct state established,related accept
    counter log prefix "clarix-airgap-drop " drop
  }
  chain input {
    type filter hook input priority 0; policy drop;
    iifname "lo" accept
    ct state established,related accept
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
  }
}
